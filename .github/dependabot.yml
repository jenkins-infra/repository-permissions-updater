version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Managed dependencies for groovy-all used to scan Jenkinsfile to match our expectations.
      - dependency-name: "org.codehaus.groovy:groovy-all"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
