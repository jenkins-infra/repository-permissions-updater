name: '🏠 Hosting request'
labels: 'hosting-request'
description: I want to host a plugin or library in the Jenkins organization

body:
  - type: input
    attributes:
      label: Repository URL
      description: |
        URL of the repository to host in the jenkinsci organization
      placeholder: |
        https://github.com/your-org/your-repo-name
    validations:
      required: true
  - type: input
    attributes:
      label: New Repository Name
      description: |
        Name of the repository in the jenkinsci organization on GitHub, plugins should end with `-plugin`, libraries should start with `lib-`.
        Should be all lowercased.
      placeholder: |
        your-cool-plugin
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: |
        Describe what you want hosted here. Explain how it's different from other components that may be considered similar to this one.
    validations:
      required: true
  - type: textarea
    attributes:
      label: GitHub and Jenkins project users
      description: |
        Define the users that should get GitHub repository access and Jenkins project release permissions. Put GitHub and the corresponding Jenkins project user on the same line. The GitHub user must be prefixed with an `@` symbol, and the Jenkins project user must be listed as is.
        You can first write the GitHub user and then the Jenkins project user, or vice versa. You can also write only one of them, if certain users should not have both permissions. At least one GitHub and one Jenkins project user must be listed.
        The Jenkins project has its own identity system, users can sign up at https://accounts.jenkins.io. All users *must* sign in to [Jira](https://issues.jenkins.io). Sign in to [Artifactory](https://repo.jenkins-ci.org/) is required when automated releases are disabled.
      placeholder: |
        @githubuser1 jirauser1
        @githubuser2
        jirauser3
        jirauser4 @githubuser4
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Automated release via GitHub Actions (recommended)
      description: See https://www.jenkins.io/doc/developer/publishing/releasing-cd/ for more information.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
